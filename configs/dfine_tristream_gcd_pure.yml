# run10_gcd_pure：计划.md §2.7 续，run9_gcd 线上 53.784 判负后的修正版。
# 根因：训练 loss 仍保留 loss_bbox（L1，权重5）与 loss_gcd（权重2）叠加，
# 权重不对称导致实际优化目标仍由 L1 主导，与 matcher 用 GCD 主导匹配不一致
# （loss 和匹配目标不匹配）。本版本让 GCD 完全替代 L1：criterion.py 的
# GCDCriterion 已去掉 loss_bbox 计算，这里同步去掉 weight_dict 里的
# loss_bbox 键，并把 loss_gcd 权重从2提到5，与 matcher.cost_bbox=5 对齐，
# 使匹配和训练优化用同一套距离度量、同一权重量级。
# 与 run9_gcd 的 dfine_tristream_gcd.yml 相比，只改 criterion.weight_dict
# （去掉 loss_bbox，loss_gcd 2→5）与 train.save_dir 两处，其余逐项对齐。

num_classes: 12
image_size: [736, 1280]

pretrained_detector: /home/u703/AIC_Project_sy/AIC/weights/dfine_l_coco.pth

backbone:
  name: B4
  use_lab: false
  return_idx: [1, 2, 3]
  pretrained: true

opf:
  num_heads: 8
  sr_ratios: [4, 2, 1]

encoder:
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  use_encoder_idx: [2]
  num_encoder_layers: 1
  expansion: 1.0
  act: silu

decoder:
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  num_points: [3, 6, 3]
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu

matcher:
  weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
  use_focal_loss: true
  alpha: 0.25
  gamma: 2.0
  cost_type: gcd    # aic/models/matcher.py GCDHungarianMatcher，cost_bbox 用 GCD 替代 L1

criterion:
  # loss_bbox（原始 L1）已从 weight_dict 中移除，GCDCriterion.loss_boxes 不再计算它。
  # loss_gcd 权重从 2 提到 5，与 matcher.cost_bbox=5 对齐，让匹配和训练优化目标一致。
  weight_dict: {loss_vfl: 1, loss_giou: 2, loss_gcd: 5, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32

train:
  data_root: "/home/u703/AIC_Project_sy/dataset/训练集"
  n_folds: 5
  fold: 0
  batch_size: 3
  grad_accum_steps: 3
  epochs: 48
  warmup_epochs: 2
  lr: 1.4e-4
  backbone_lr_mult: 0.05
  weight_decay: 1.0e-4
  grad_clip_norm: 0.1
  amp_dtype: bfloat16
  modality_dropout_p: 0.1
  num_workers: 8
  save_dir: /home/u703/AIC_Project_sy/AIC/outputs/run10_gcd_pure
  log_interval: 20
  eval_interval_epochs: 2
  keep_last_n: 3
  ema:
    enabled: true
    decay: 0.998
    warmups: 200
  class_balance:
    enabled: true
    oversample_thr: 0.2
  multi_scale:
    enabled: true
    sizes: [[576, 1024], [640, 1120], [672, 1184], [736, 1280], [800, 1408]]

inference:
  score_thresh: 0.05
  max_boxes: 100
