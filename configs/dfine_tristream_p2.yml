# P0 实验：在 dfine_tristream_hires.yml 基础上加入 P2/stride-4 特征层级。
# 动机与验证步骤见 计划.md §2.1，算法设计.md §8.2。
# 除计划里列出的三行改动（backbone.return_idx / encoder.feat_strides / decoder.num_levels）外，
# 还有三处必须联动修改的隐藏依赖，否则维度不对齐或语义错位：
#   - decoder.num_points 长度必须等于 num_levels（4 层需要 4 个数，原 [3,6,3] 无实验依据地
#     在前面插入一个 3，新增的 P2 层暂按保守取点，之后若 P0 有效值得单独消融）
#   - encoder.use_encoder_idx 是"在第几个尺度做全局自注意力"的索引，原来 [2] 指向 3 层里的
#     最后一层（stride 32，最粗粒度），4 层后最后一层变成 index 3，索引必须跟着变
#   - opf.sr_ratios 是让各尺度 K/V 序列长度保持一致的降采样倍率（见 opf_fusion.py 注释），
#     按 2 的幂延伸到 4 层，正好等于 MultiScaleOPF 在 sr_ratios=None 时的自动公式

num_classes: 12
image_size: [736, 1280]

pretrained_detector: /home/u703/AIC_Project_sy/AIC/weights/dfine_l_coco.pth

backbone:
  name: B4
  use_lab: false
  return_idx: [0, 1, 2, 3]   # 改动：加入 stride-4（P2）
  pretrained: true

opf:
  num_heads: 8
  sr_ratios: [8, 4, 2, 1]    # 改动：4 层几何递减，K/V 序列长度保持一致

encoder:
  feat_strides: [4, 8, 16, 32]   # 改动：加入 stride-4
  hidden_dim: 256
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  use_encoder_idx: [3]        # 改动：最后一层索引从 2 变为 3
  num_encoder_layers: 1
  expansion: 1.0
  act: silu

decoder:
  hidden_dim: 256
  num_levels: 4              # 改动：3 -> 4
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  num_points: [3, 3, 6, 3]   # 改动：长度补齐到 4，新增 P2 层暂取保守值
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu

matcher:
  weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
  use_focal_loss: true
  alpha: 0.25
  gamma: 2.0

criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32

train:
  data_root: "/home/u703/AIC_Project_sy/dataset/训练集"
  n_folds: 5
  fold: 0
  # P2 层特征图面积是 P3 的 4 倍，OPF 逐像素处理 + HybridEncoder 的 FPN/PAN 卷积都在这一层
  # 承担明显更高的显存/计算量。batch_size 相对 hires baseline（3）先保守减半，具体数值按
  # 计划.md §2.1 步骤 1 的小规模 trial 实测显存爬梯后再调整。
  batch_size: 2             # 裁掉 multi_scale 顶档 800x1408（OOM 根源）后，736x1280 峰值
                             # 与 hires baseline 量级相近，恢复 batch_size=2 避免 BN 统计量崩坏
  grad_accum_steps: 3       # 有效 batch = 2*4*3 = 24（4 卡）
  epochs: 48
  warmup_epochs: 2
  lr: 1.4e-4
  backbone_lr_mult: 0.05
  weight_decay: 1.0e-4
  grad_clip_norm: 0.1
  amp_dtype: bfloat16
  modality_dropout_p: 0.1
  num_workers: 8
  save_dir: /home/u703/AIC_Project_sy/AIC/outputs/run5_p2
  log_interval: 20
  eval_interval_epochs: 2
  keep_last_n: 3
  ema:
    enabled: true
    decay: 0.998
    warmups: 200
  class_balance:
    enabled: true
    oversample_thr: 0.2
  multi_scale:
    enabled: true
    sizes: [[576, 1024], [640, 1120], [672, 1184], [736, 1280]]   # 裁掉顶档 800x1408，避免 OOM

inference:
  score_thresh: 0.05
  max_boxes: 100
