# Full-data same-architecture self-distillation from the 60.53 D-FINE-X student.

num_classes: 12
image_size: [736, 1280]
pretrained_detector: /home/u703/AIC_Project_sy/AIC/weights/dfine_x_coco.pth

backbone:
  name: B5
  use_lab: false
  return_idx: [1, 2, 3]
  pretrained: true
  depth_in_chs: 5

opf:
  num_heads: 8
  sr_ratios: [4, 2, 1]
  hard_depth_gate: true

encoder:
  feat_strides: [8, 16, 32]
  hidden_dim: 384
  nhead: 8
  dim_feedforward: 2048
  dropout: 0.0
  enc_act: gelu
  use_encoder_idx: [2]
  num_encoder_layers: 1
  expansion: 1.0
  act: silu

decoder:
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 8
  num_points: [3, 6, 3]
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu

matcher:
  weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
  use_focal_loss: true
  alpha: 0.25
  gamma: 2.0

criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32

train:
  seed: 42
  data_root: "/home/u703/AIC_Project_sy/dataset/训练集"
  n_folds: 5
  fold: 0
  full_data: true
  batch_size: 2
  grad_accum_steps: 3
  epochs: 48
  warmup_epochs: 2
  lr: 1.4e-4
  backbone_lr_mult: 0.05
  weight_decay: 1.0e-4
  grad_clip_norm: 0.1
  amp_dtype: bfloat16
  # Kept clean in the CPU transform; student-only dropout is applied in the
  # training loop so the static teacher always receives complete modalities.
  modality_dropout_p: 0.0
  num_workers: 8
  save_dir: /home/u703/AIC_Project_sy/AIC/outputs/run_x_selfdistill_full2000_48
  log_interval: 20
  eval_interval_epochs: 1
  keep_last_n: 12
  keep_best_n: 0
  stage2_start_epoch: 40
  stage2_modality_dropout_p: 0.0
  stage2_scale_range: [1.0, 1.0]
  ema:
    enabled: true
    decay: 0.998
    warmups: 200
  class_balance:
    enabled: true
    oversample_thr: 0.2
  multi_scale:
    enabled: true
    sizes: [[576, 1024], [640, 1120], [672, 1184], [736, 1280], [800, 1408]]
  disp8_mode: use

inference:
  score_thresh: 0.05
  max_boxes: 100

self_distill:
  teacher_ckpt: /home/u703/AIC_Project_sy/AIC/outputs/run_x_m2d_pkd_nocross_full64/epoch47.pt
  use_teacher_ema: true
  cls_weight: 2.0
  bbox_weight: 5.0
  giou_weight: 2.0
  temperature: 2.0
  teacher_score_thresh: 0.25
  teacher_gt_iou_thresh: 0.5
  start_epoch: 4
  ramp_epochs: 4
  peak_scale: 1.0
  decay_start_epoch: 36
  stop_epoch: 40
  student_modality_dropout_p: 0.1
  student_dropout_stop_epoch: 40
