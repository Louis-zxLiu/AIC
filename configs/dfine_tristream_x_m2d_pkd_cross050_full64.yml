# D-FINE-X full-data ablation: five-channel teachers with cross_weight=0.5.

num_classes: 12
image_size: [736, 1280]
pretrained_detector: /home/u703/AIC_Project_sy/AIC/weights/dfine_x_coco.pth

backbone:
  name: B5
  use_lab: false
  return_idx: [1, 2, 3]
  pretrained: true
  depth_in_chs: 5

opf:
  num_heads: 8
  sr_ratios: [4, 2, 1]
  hard_depth_gate: true

encoder:
  feat_strides: [8, 16, 32]
  hidden_dim: 384
  nhead: 8
  dim_feedforward: 2048
  dropout: 0.0
  enc_act: gelu
  use_encoder_idx: [2]
  num_encoder_layers: 1
  expansion: 1.0
  act: silu

decoder:
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 8
  num_points: [3, 6, 3]
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu

matcher:
  weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
  use_focal_loss: true
  alpha: 0.25
  gamma: 2.0

criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32

train:
  data_root: "/home/u703/AIC_Project_sy/dataset/\u8bad\u7ec3\u96c6"
  n_folds: 5
  fold: 0
  full_data: true
  batch_size: 2
  grad_accum_steps: 3
  epochs: 64
  warmup_epochs: 2
  lr: 1.4e-4
  backbone_lr_mult: 0.05
  weight_decay: 1.0e-4
  grad_clip_norm: 0.1
  amp_dtype: bfloat16
  modality_dropout_p: 0.1
  num_workers: 8
  save_dir: /home/u703/AIC_Project_sy/AIC/outputs/run_x_m2d_pkd_cross050_full64
  log_interval: 20
  eval_interval_epochs: 1
  keep_last_n: 24
  keep_best_n: 3
  ema:
    enabled: true
    decay: 0.998
    warmups: 200
  class_balance:
    enabled: true
    oversample_thr: 0.2
  multi_scale:
    enabled: true
    sizes: [[576, 1024], [640, 1120], [672, 1184], [736, 1280], [800, 1408]]
  disp8_mode: use

inference:
  score_thresh: 0.05
  max_boxes: 100

distill:
  ir_teacher_ckpt: /home/u703/AIC_Project_sy/AIC/outputs/teacher_ir_x_select1900_val100_64/epoch53.pt
  depth_teacher_ckpt: /home/u703/AIC_Project_sy/AIC/outputs/teacher_depth_x_fold0_depthv2/epoch63.pt
  method: pkd_lcm
  weight: 1.0
  use_teacher_ema: true
  foreground_weight: 2.0
  level_weights: [2.0, 1.0, 1.0]
  use_depth_valid_mask: true
  cross_weight: 0.5
  adapter_reduction: 16
