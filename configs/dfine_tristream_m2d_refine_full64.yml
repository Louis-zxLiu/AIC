# 三流 D-FINE 训练配置，在 dfine_tristream_hires.yml（run3_hires 基线）基础上加
# M2D 蒸馏（计划.md §2.8 后续，memory `fusion-degradation-confirmed`）：linear
# probing 诊断证实联合训练拖累了 IR/Depth backbone 的表征质量（frozen probe
# mAP@50-95 明显低于独立单模态训练：IR 0.0444 vs 0.0932，Depth 0.0544 vs
# 0.0656），RGB 不受影响。用两个独立训练到收敛的单模态 teacher（dfine_teacher_
# ir_full.yml/dfine_teacher_depth_full.yml，48 epoch）在 backbone 输出（OPF 融合
# 之前）对 student 的 IR/Depth 多尺度特征做 cosine 蒸馏，见下方 distill 段。
# 除新增 distill 段外，其余超参与 run3_hires 完全一致，唯一变量是蒸馏本身。
# 数值依据 计划.md §三 与 third_party/D-FINE/configs/dfine/include/dfine_hgnetv2.yml
# 的 D-FINE-L 默认超参，backbone 换成 B4（显存/精度折中，单卡 32GB 可跑，详见 §3.3 显存爬梯策略）。

num_classes: 12
# 矩形输入：数据集全是 16:9，旧的 640x640 方形 resize 带来 1.78x 形状畸变，
# 并把目标面积压到 0.444 倍 —— 47% 的框掉进 <32px 小目标桶，而实测 AP_small
# 只有 0.041（AP_large 0.659，16 倍差距）。736x1280 面积比回到 0.674，畸变
# 降到 1.02x，<32px 占比降到约 26%，<16px 从 16% 降到约 5%。
# 顺序是 [h, w]。
image_size: [736, 1280]

# 官方 D-FINE-L 的完整检测器权重（COCO 54.0 mAP）。加载它之后 HybridEncoder 和
# DFINETransformer 才有预训练初始化——只靠 backbone.pretrained 的话这两个模块是
# 完全随机初始化的，DETR 系解码器在 1600 张图的数据量上从零训练不可能收敛。
# 12 类分类头因 shape 与 COCO 的 80 类不符而自动跳过，保持随机初始化。
# 置为 null 可关闭（例如比赛规则不允许 COCO 检测预训练时）。
pretrained_detector: /home/u703/AIC_Project_sy/AIC/weights/dfine_l_coco.pth

backbone:
  name: B4          # 显存不足时按 §3.3 降级到 B2；充裕时可试 B5
  use_lab: false
  return_idx: [1, 2, 3]
  pretrained: true   # HGNetv2 官方 ImageNet 分类预训练权重（PPHGNetV2_B4_stage1.pth）初始化 RGB 分支，
                     # IR/Depth 分支的 stem 由 RGB stem 权重按输入通道取均值推导初始化。
                     # 注意：这里只是 backbone 分类权重，检测头的预训练见上面 pretrained_detector。

opf:
  num_heads: 8
  # 各尺度交叉注意力的 K/V 空间降采样倍率，对应 return_idx 的 stride 8/16/32。
  # 原本 Q/K/V 都是全分辨率，注意力是 O((h·w)²)，stride-8 上 h·w=6400 直接把
  # batch_size 逼到 1（连带毁掉 BN 统计量、每 epoch 只剩 50 次 optimizer step）。
  # 降采样后三个尺度的 K/V 长度都是 20×20=400，代价在各尺度间均衡。
  sr_ratios: [4, 2, 1]

encoder:
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  use_encoder_idx: [2]
  num_encoder_layers: 1
  expansion: 1.0
  act: silu

decoder:
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  num_points: [3, 6, 3]
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu

matcher:
  weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
  use_focal_loss: true
  alpha: 0.25
  gamma: 2.0

criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32

train:
  data_root: "/home/u703/AIC_Project_sy/dataset/训练集"
  n_folds: 5
  fold: 0
  full_data: true
  batch_size: 2          # 4 卡续训；GPU 0 另有约 2GB 占用，bs=3 在最大多尺度输入下会 OOM
  grad_accum_steps: 3    # 4 卡有效 batch = 2*4*3 = 24
                          # 按实测显存爬梯定档：736x1280@bs3 峰值 14.9G、多尺度上界
                          # 800x1408@bs3 峰值 17.8G，单卡 31G 留 13G 余量。
                          # 旧注释保留（OPF K/V 降采样的作用）：OPF 的 K/V 降采样（opf.sr_ratios）把注意力
                          # 从 O((h·w)²) 降到 O(h·w·400) 之后，batch_size 才回到 4：
                          #   - BN 统计量从 2 个样本变成 8 个（SyncBN 跨双卡），不再是噪声
                          #   - 每 epoch optimizer step 从 50 变成 200，48 epoch 共 9600 步
                          # lr 按 total batch 16 线性缩放：官方 2.5e-4 @ batch 32 → 1.25e-4
  epochs: 64
  warmup_epochs: 2
  lr: 1.4e-4              # full-data training from detector pretraining
  backbone_lr_mult: 0.05  # 对齐官方 D-FINE-L：backbone lr = 1.25e-5 = base_lr/20
  weight_decay: 1.0e-4
  grad_clip_norm: 0.1
  amp_dtype: bfloat16
  modality_dropout_p: 0.1
  num_workers: 8
  save_dir: /home/u703/AIC_Project_sy/AIC/outputs/run_m2d_refine_full64
  log_interval: 20
  eval_interval_epochs: 2
  keep_last_n: 3           # 只留最近 3 个
  keep_best_n: 3           # 额外保留验证集 top-3 checkpoint
  ema:                     # 算法设计.md §3.1，D-FINE 官方默认开启
    enabled: true
    decay: 0.998           # 时间常数 ≈500 步，匹配总步数 9600。原先 0.9999 的时间常数是
                            # 10000 步，比整个训练还长；加上 warmups 公式
                            # d = decay*(1-exp(-updates/warmups))，实际 decay 全程卡在 0.9 左右
                            # （≈10 步平均），等于完全没做权重平滑。
    warmups: 200
  class_balance:            # 算法设计.md §3.4，计划.md §2.4 tier 1；单卡有效，DDP 下暂退化为均匀 shuffle
    enabled: true
    oversample_thr: 0.2
  multi_scale:              # 算法设计.md §3.5，训练末 20%（1-stop_decay_epoch_ratio）epoch 自动关闭
    enabled: true
    # 矩形输入下各档必须保持与 base 相同的长宽比，否则多尺度会额外注入形状畸变。
    # 全部是 32 的倍数（backbone stride 对齐），比值 1.74~1.78。
    sizes: [[576, 1024], [640, 1120], [672, 1184], [736, 1280], [800, 1408]]

inference:
  score_thresh: 0.05    # 低阈值先出全部候选，最终提交前按 §四 max_boxes 截断
  max_boxes: 100

distill:                # M2D 蒸馏（见文件头注释），train.py 检测到本段存在才会启用
  ir_teacher_ckpt: /home/u703/AIC_Project_sy/AIC/outputs/teacher_ir_full/epoch47.pt
  depth_teacher_ckpt: /home/u703/AIC_Project_sy/AIC/outputs/teacher_depth_full/epoch47.pt
  weight: 1.0            # 与主 loss（vfl+bbox+giou+fgl+ddf 及其深监督副本，量级约 40~50）
  use_teacher_ema: true
  foreground_weight: 2.0
  level_weights: [2.0, 1.0, 1.0]
  use_depth_valid_mask: true
                         # 相比，cosine loss 本身在 [0,2] 量级，先用 1.0 起点观察收敛曲线，
                         # 若蒸馏 loss 主导/淹没检测 loss 再调小

